[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "metrics-show-client"
version = "0.1.0"
description = "Python client and wire models for training and evaluation metrics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "pydantic>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]
